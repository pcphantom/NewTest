name: Validate browser game

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check modules
        run: |
          for source_file in src/*.js; do
            node --check "$source_file"
          done

      - name: Test
        run: npm test

      - name: Verify matching asset versions
        run: node scripts/version-assets.mjs --check

      - name: Validate static entry
        run: |
          test -f index.html
          test -f Styles.css
          test -f src/GameBootstrap.js
          test -f GDD.md
          test -f card_prompts.md

      - name: Check project writing rules
        run: |
          if grep -nE '—|&mdash;' GDD.md card_prompts.md README.md Styles.css index.html src/*.js tests/*.mjs; then
            echo "Forbidden em dash found."
            exit 1
          fi
