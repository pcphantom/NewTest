name: Validate browser game

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: npm test

      - name: Validate static entry
        run: |
          test -f index.html
          test -f Styles.css
          test -f src/GameBootstrap.js
